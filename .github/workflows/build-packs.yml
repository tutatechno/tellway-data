name: Csomagok építése

# **Nincs szerver, nincs kézi munka.** A Geofabrik kivonatait a GitHub
# saját futtatói töltik le és dolgozzák fel, aztán feltöltik a kész
# csomagot egy release-be. Nyilvános repóban ez ingyenes.
#
# Indítás: Actions → „Csomagok építése" → Run workflow. A `regions`
# mezőbe vessző nélkül hagyva minden régió elkészül; egy-két név
# megadásával csak azok (pl. `hungary,austria`).

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Régiók vesszővel, üresen hagyva: mind'
        required: false
        default: ''
      limit:
        description: 'Hány régió készüljön el ebben a futásban (0 = mind)'
        required: false
        default: '0'
  schedule:
    # Évente egyszer újraépítjük: ami az OSM-ben gyorsan avul
    # (nyitvatartás, üzletek), arra az app nem támaszkodik.
    - cron: '0 3 1 2 *'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        run: |
          python3 tools/plan_regions.py regions.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          regions = json.load(open('regions.json', encoding='utf-8'))
          want = [x.strip() for x in os.environ.get('WANT','').split(',') if x.strip()]
          if want:
              regions = [r for r in regions if r['id'] in want]
          limit = int(os.environ.get('LIMIT') or 0)
          if limit:
              regions = regions[:limit]
          print('matrix=' + json.dumps({'region': regions}))
          EOF
        env:
          WANT: ${{ github.event.inputs.regions }}
          LIMIT: ${{ github.event.inputs.limit }}
      - uses: actions/upload-artifact@v4
        with:
          name: regions-plan
          path: regions.json

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      # Egyszerre húsz futtató dolgozik; ha egy régió elhasal, a többi megy.
      max-parallel: 20
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium

      # A futtatón ~14 GB szabad hely van. A kivonat és az SQLite is a
      # nagyobb lemezre kerül, nem a rendszerpartícióra.
      - name: Hely felszabadítása
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Kivonat letöltése
        run: |
          curl -sSL --retry 3 -o region.osm.pbf "${{ matrix.region.pbf }}"
          ls -la region.osm.pbf
          curl -sSI "${{ matrix.region.pbf }}" | grep -i last-modified \
            | sed 's/.*: //' > extract-date.txt || true

      - name: Csomag építése
        run: |
          DATE=$(python3 - <<'EOF'
          import email.utils, time, pathlib
          raw = pathlib.Path('extract-date.txt').read_text().strip()
          try:
              t = email.utils.parsedate_to_datetime(raw)
              print(t.strftime('%Y-%m-%d'))
          except Exception:
              print(time.strftime('%Y-%m-%d'))
          EOF
          )
          echo "kivonat dátuma: $DATE"
          TWPACK_DB=build.sqlite python3 tools/build_region.py \
            region.osm.pbf out "${{ matrix.region.id }}" \
            "${{ matrix.region.name }}" "$DATE"
          rm -f region.osm.pbf build.sqlite
          ls -la out

      - name: Feltöltés a release-be
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view packs >/dev/null 2>&1 || \
            gh release create packs --title "TellWay OSM csomagok" \
              --notes "Adatok © OpenStreetMap contributors, ODbL 1.0. Készítette: tools/build_region.py"
          gh release upload packs "out/${{ matrix.region.id }}.twpack" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.region.id }}
          path: out/${{ matrix.region.id }}.json

  catalog:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: entries
      - name: catalog.json frissítése
        run: python3 tools/make_catalog.py entries catalog.json
      - name: Commit
        run: |
          git config user.name 'tellway-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add catalog.json regions.json 2>/dev/null || git add catalog.json
          git commit -m 'catalog.json frissítve' || echo 'nincs változás'
          git push
